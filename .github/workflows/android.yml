# Builds the Flame CTS Android app (android/) around the current page and
# attaches it, unsigned, to this version's release (FlameCTS-Android-unsigned.apk). The APK is signed outside GitHub with the
# release key (android/sign_apk.py), so this run proves the signing script
# with a throw-away key and Android's own apksigner.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '!android/latest.json', '!android/dist/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the page
        run: |
          npm ci
          npm run build:app
          rm -rf android/app/src/main/assets/app
          cp -r app android/app/src/main/assets/app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK
        run: gradle -p android --no-daemon assembleRelease
      - name: Check the signing script
        run: |
          pip install --quiet cryptography
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -c -p 4 "$apk"
          keytool -genkeypair -keystore t.p12 -storetype PKCS12 -storepass test1234 -alias t -keyalg RSA -keysize 3072 -validity 30 -dname "CN=Test"
          python3 android/sign_apk.py "$apk" test-signed.apk t.p12 test1234
          "$bt/apksigner" verify --verbose --min-sdk-version 24 test-signed.apk
          "$bt/aapt2" dump badging test-signed.apk | head -5
      - name: Attach the unsigned APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do gh release view "v$v" >/dev/null 2>&1 && break; sleep 30; done
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk FlameCTS-Android-unsigned.apk
          gh release upload "v$v" FlameCTS-Android-unsigned.apk --clobber
