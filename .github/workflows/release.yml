# Builds the Windows installer and publishes it as a GitHub release whenever
# the version in package.json changes on main. Installed Flame CTS apps
# check these releases and update themselves.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this version is already released
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      # Any failure prints its last lines as error annotations, so the reason
      # shows on the run's summary page.
      - name: Build installer
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          run() { "$@" > step.log 2>&1 || { tail -n 25 step.log | sed 's/^/::error::/'; exit 1; }; }
          run npm ci
          run npm run build:app
          run npx electron-builder --win nsis --x64 --publish never
          ls dist
      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" \
            "dist/FlameCTS-Setup-$v.exe" "dist/FlameCTS-Setup-$v.exe.blockmap" dist/latest.yml \
            --title "Flame CTS $v" --notes "Flame CTS $v. Installed apps update to this version automatically." > step.log 2>&1 \
            || { tail -n 25 step.log | sed 's/^/::error::/'; exit 1; }
